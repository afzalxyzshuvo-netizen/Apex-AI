name: Build Apex AI Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android Scaffold & Dependencies
      run: |
        flutter create --org com.apexai --platforms android .
        flutter pub get

    - name: Build Release APK
      run: flutter build apk --release

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Apex_AI_Release_APK
        path: build/app/outputs/flutter-apk/app-release.apk
